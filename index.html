
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless Computing Practical</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #cffafe);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 25px #0002;
            max-width: 400px;
        }

        h1 {
            color: #0369a1;
        }

        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0369a1;
        }

        #result {
            margin-top: 20px;
            color: #166534;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Serverless Computing</h1>
        <p>Practical 6: Netlify Functions</p>
        <p>Click below to call a serverless function.</p>

        <button onclick="getGreeting()">Call Function</button>

        <div id="result"></div>
    </div>

    <script>
        async function getGreeting() {
            const result = document.getElementById("result");
            result.textContent = "Loading...";

            try {
                const response = await fetch("/.netlify/functions/greet");
                const data = await response.json();
                result.textContent = data.message;
            } catch (error) {
                result.textContent = "Error calling the function.";
            }
        }
    </script>
</body>
</html>
